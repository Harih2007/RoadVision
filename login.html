<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadVision — Select Camera</title>
  <meta name="description" content="Sign in to RoadVision — AI-powered traffic analytics and illegal plate detection system." />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Ambient Background Orbs */
    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
    }

    .orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(99, 102, 241, 0.15);
      top: 10%;
      left: 15%;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      background: rgba(16, 185, 129, 0.12);
      bottom: 10%;
      right: 15%;
    }

    /* ---------- Login Card ---------- */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 36px 32px;
      box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.08), 0 8px 20px -4px rgba(15, 23, 42, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    /* ---------- Brand ---------- */
    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .login-brand-icon {
      width: 46px;
      height: 46px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), #6366F1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.3);
    }

    .login-brand-text h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.4px;
    }

    .login-brand-text p {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* ---------- Heading ---------- */
    .login-heading {
      margin-bottom: 24px;
    }

    .login-heading h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .login-heading p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Camera Selection Buttons */
    .camera-select-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: left;
    }

    .camera-select-btn:hover {
      background: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.15);
      transform: translateY(-2px);
    }

    .camera-select-btn .cam-icon-box {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: rgba(79, 70, 229, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }

    .camera-select-btn .material-symbols-outlined {
      font-size: 20px;
    }

    .camera-select-btn .cam-meta-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-primary);
    }

    .camera-select-btn .cam-meta-loc {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .camera-select-btn .cam-status-icon {
      margin-left: auto;
      color: var(--success);
      font-size: 20px;
    }

    /* ---------- Status Bar ---------- */
    .login-status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-light);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }

    .login-status-bar span {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
    }

    /* ---------- Error State ---------- */
    .login-error {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: var(--radius-md);
      color: var(--alert-text);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .login-error.show { display: flex; }
  </style>
</head>
<body>

  <!-- Ambient Light Orbs for Morphism -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <div class="login-brand-icon">
          <span class="material-symbols-outlined">visibility</span>
        </div>
        <div class="login-brand-text">
          <h1>RoadVision</h1>
          <p>Traffic Analytics Platform</p>
        </div>
      </div>

      <!-- Heading -->
      <div class="login-heading">
        <h2>Select Camera</h2>
        <p>Choose an active camera node to open surveillance dashboard</p>
      </div>

      <!-- Error Banner -->
      <div class="login-error" id="loginError">
        <span class="material-symbols-outlined" style="font-size:18px">error</span>
        <span id="loginErrorText">Please select a camera to continue.</span>
      </div>

      <!-- Camera Selection -->
      <div class="login-form" id="cameraSelection">
        <div class="form-group" style="display:flex; flex-direction:column; gap:10px;">
          <button class="camera-select-btn" data-camera="1">
            <div class="cam-icon-box">
              <span class="material-symbols-outlined">videocam</span>
            </div>
            <div>
              <div class="cam-meta-name">Camera 1</div>
              <div class="cam-meta-loc">Main Expressway North</div>
            </div>
            <span class="material-symbols-outlined cam-status-icon">check_circle</span>
          </button>
          
          <button class="camera-select-btn" data-camera="2">
            <div class="cam-icon-box">
              <span class="material-symbols-outlined">videocam</span>
            </div>
            <div>
              <div class="cam-meta-name">Camera 2</div>
              <div class="cam-meta-loc">City Center Junction</div>
            </div>
            <span class="material-symbols-outlined cam-status-icon">check_circle</span>
          </button>
          
          <button class="camera-select-btn" data-camera="3">
            <div class="cam-icon-box">
              <span class="material-symbols-outlined">videocam</span>
            </div>
            <div>
              <div class="cam-meta-name">Camera 3</div>
              <div class="cam-meta-loc">Highway Toll Plaza</div>
            </div>
            <span class="material-symbols-outlined cam-status-icon">check_circle</span>
          </button>
          
          <button class="camera-select-btn" data-camera="4">
            <div class="cam-icon-box">
              <span class="material-symbols-outlined">videocam</span>
            </div>
            <div>
              <div class="cam-meta-name">Camera 4</div>
              <div class="cam-meta-loc">Airport Road Entry</div>
            </div>
            <span class="material-symbols-outlined cam-status-icon">check_circle</span>
          </button>
        </div>
      </div>

      <!-- Status Bar -->
      <div class="login-status-bar">
        <span class="status-dot"></span>
        <span>SEC_NODE_01: ONLINE • AES-256-GCM ENCRYPTED</span>
      </div>

    </div>
  </div>

  <script>
    // ---- Camera Selection Logic ----
    const errBox = document.getElementById('loginError');
    const cameraButtons = document.querySelectorAll('.camera-select-btn');

    cameraButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cameraId = btn.dataset.camera;
        const cameraName = btn.querySelector('.cam-meta-name').textContent;
        const cameraLocation = btn.querySelector('.cam-meta-loc').textContent;
        
        // Save camera selection to localStorage
        localStorage.setItem('roadvision_camera', JSON.stringify({
          id: `CAM-00${cameraId}`,
          name: cameraName,
          location: cameraLocation,
          resolution: '1080p',
          latitude: '',
          longitude: '',
          address: '',
          accuracy: '',
        }));
        
        // Redirect to dashboard
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
